[build]
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# NOTE: the every-minute schedule was removed on purpose.
# Netlify scheduled functions are rate-limited on the free plan, so reminders are
# now driven by .github/workflows/video-calls.yml (free, no function quota).
# The function itself is kept so it can be invoked manually if needed.
[functions."check-video-calls"]
  schedule = "*/10 * * * *"
